<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เดินเครื่องโรงงานปูน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #D6D4CF; --ground: #C4C1BA; --ink: #1C2024; --muted: #555B61;
    --panel: rgba(240, 238, 234, .95); --line: #A9A6A0; --heat: #B83C0A; --hazard: #F2B705; --fuel: #5B6168; --good: #25744C;
    --good-bg: #25744C; --heat-bg: #B83C0A;
    --bar: #2A2F35; --bar-ink: #E9E7E2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E2226; --ground: #2A2E33; --ink: #ECEAE5; --muted: #A4A9AE; --panel: rgba(30, 34, 38, .95); --line: #474C52;
      --heat: #F58A55; --fuel: #9AA1A8; --good: #4FBF85; --bar: #15181B; --good-bg: #25744C; --heat-bg: #B83C0A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E2226; --ground: #2A2E33; --ink: #ECEAE5; --muted: #A4A9AE; --panel: rgba(30, 34, 38, .95); --line: #474C52;
    --heat: #F58A55; --fuel: #9AA1A8; --good: #4FBF85; --bar: #15181B; --good-bg: #25744C; --heat-bg: #B83C0A;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Archivo", "IBM Plex Sans Thai", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; -webkit-tap-highlight-color: transparent; }
  #wrap { position: relative; flex: 1; min-height: 0; }
  #view { position: absolute; inset: 0; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #stage canvas { display: block; }
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 700; font-stretch: 90%; font-size: 14px;
    padding: 4px 9px; border-radius: 3px; background: var(--panel); border: 1.5px solid var(--line); color: var(--ink); transition: opacity .3s; }
  .tag.off { opacity: 0; pointer-events: none !important; }
  .tag.co2 { background: var(--heat-bg); color: #fff; border-color: var(--heat-bg); }
  .tag.pick { pointer-events: auto; cursor: pointer; font-size: 15px; padding: 8px 12px; border: 2px solid var(--ink); }
  .tag.pick.ok { background: var(--good-bg); border-color: var(--good-bg); color: #fff; }
  .tag.pick.no { animation: shake .35s ease; background: var(--heat-bg); border-color: var(--heat-bg); color: #fff; }
  @keyframes shake { 20%, 60% { margin-left: -6px; } 40%, 80% { margin-left: 6px; } }

  #card { position: absolute; z-index: 2; left: clamp(12px, 2vw, 28px); top: clamp(12px, 2.5vh, 28px); width: min(410px, calc(100% - 24px));
    max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; padding: 18px 18px 16px; }
  #card::before { content: ""; position: absolute; left: -2px; right: -2px; top: -2px; height: 8px;
    background: repeating-linear-gradient(-45deg, var(--hazard) 0 10px, #1C2024 10px 20px); }
  .num { margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dots { display: flex; gap: 3px; } .dots i { width: 14px; height: 5px; background: var(--line); border-radius: 1px; } .dots i.on { background: var(--hazard); }
  #title { margin: 4px 0 6px; font-size: clamp(24px, 3vw, 34px); line-height: 1.3; font-weight: 800; font-stretch: 84%; }
  #task { margin: 0; font-size: 16px; line-height: 1.55; font-weight: 600; }
  .hud { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .hud:empty { display: none; }
  .meter { display: grid; grid-template-columns: 96px 1fr minmax(74px, auto); gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
  .meter .tr { height: 12px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
  .meter .fl { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--heat); }
  .meter .mk { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
  .meter b { white-space: nowrap; font-family: "Big Shoulders Stencil Display", "Archivo", "IBM Plex Sans Thai", sans-serif; font-size: 18px; text-align: right; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 13px; font-weight: 800; padding: 3px 8px; border-radius: 2px; color: #fff; }
  .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .actions:empty { display: none; }
  .big { flex: 1; min-width: 120px; font: 800 17px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; font-stretch: 90%; padding: 14px 12px; border-radius: 4px;
    border: 2px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  .big.hot { background: var(--heat-bg); border-color: var(--heat-bg); color: #fff; }
  .big.alt { background: transparent; color: var(--ink); }
  .big.held { filter: brightness(1.2); transform: scale(.97); }
  .big:disabled { opacity: .4; cursor: default; }
  .big.okbtn { background: var(--good-bg); border-color: var(--good-bg); color: #fff; opacity: 1; }
  .big.shakebtn { animation: shake .35s ease; border-color: var(--heat); color: var(--heat); }
  .tag.next { font-size: 15px; }
  .big:focus-visible, .bar button:focus-visible, .tag.pick:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
  #fb { margin: 10px 0 0; font-size: 15px; line-height: 1.4; color: var(--muted); }
  #fb:empty { display: none; }
  #fb b { color: var(--ink); } #fb.bad b { color: var(--heat); } #fb.good b { color: var(--good); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px 11px; background: var(--bar); color: var(--bar-ink);
    padding-bottom: calc(11px + env(safe-area-inset-bottom, 0px)); border-top: 6px solid transparent;
    border-image: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #1C2024 12px 24px) 6; }
  .bar button { min-height: 44px; min-width: 64px; font: 800 16px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; font-stretch: 90%; background: var(--hazard); color: #1C2024; border: 0; border-radius: 3px; padding: 11px 20px; cursor: pointer; }
  .bar button.ghost { background: transparent; color: var(--bar-ink); box-shadow: inset 0 0 0 2px #6B747D; }
  .bar button:disabled { opacity: .35; cursor: default; }
  .bar .msg { flex: 1; font-size: 13px; color: #A9AFB5; text-align: center; }

  .status { white-space: nowrap; flex: none; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 2px; margin-left: auto; margin-right: 8px; }
  .status:empty { display: none; }
  .status.go { background: var(--hazard); color: #1C2024; }
  .status.ok { background: var(--good-bg); color: #fff; }
  #card.done { border-color: var(--good); box-shadow: inset 0 0 0 3px var(--good); }
  #card.done::before { background: var(--good); }
  #card.done #task { color: var(--muted); }
  .donebadge { display: flex; align-items: center; gap: 10px; position: absolute; left: 50%; top: 50%; z-index: 3; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
    background: var(--good-bg); color: #fff; font: 900 30px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; font-stretch: 88%; padding: 14px 26px; border-radius: 6px; }
  .donebadge.show { animation: done 1.6s ease forwards; }
  @keyframes done { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    25% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
  .bar button.ready { animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(242, 183, 5, .35); } }
  .big.mat { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; min-width: 0; flex: 1 1 calc(50% - 8px); padding: 10px 12px; }
  .big.mat b { font-size: 17px; } .big.mat small { font: 600 13px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; opacity: .85; line-height: 1.25; }
  .scen { display: flex; flex-direction: column; gap: 8px; }
  .segs { display: flex; gap: 6px; }
  .segs button { flex: 1; font: 800 14px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; font-stretch: 90%; padding: 10px 6px; border: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 3px; cursor: pointer; }
  .segs button.on { background: var(--ink); color: var(--bg); }
  .segs button:disabled { opacity: .5; }
  .scT { margin: 0; font-size: 14px; line-height: 1.4; min-height: 3.6em; }
  @media (prefers-reduced-motion: reduce) { .donebadge.show { animation: none; opacity: 0; } .bar button.ready { animation: none; } }

  .cpanel { flex: 1 1 100%; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; position: relative;
    background: linear-gradient(180deg, #535A62, #3A3F45); border: 2px solid #1C2024; border-radius: 6px; padding: 14px 16px 14px 14px; color: #E9E7E2;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 3px 0 #1C2024; transition: opacity .4s ease; }
  .cpanel::before, .cpanel::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #23272B; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); top: 7px; }
  .cpanel::before { left: 7px; } .cpanel::after { right: 7px; }
  .cpanel.off { opacity: .5; }
  .bezel { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center;
    background: repeating-conic-gradient(#F2B705 0 15deg, #1C2024 15deg 30deg); box-shadow: 0 0 0 3px #1C2024; }
  .mush { width: 88px; height: 88px; border-radius: 50%; border: 3px solid #1C2024; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
    background: radial-gradient(circle at 36% 30%, #FF8A66, #D9480F 52%, #8A2A07); color: #fff; font: 900 15px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; letter-spacing: .5px;
    box-shadow: 0 7px 0 #5A1A04, 0 9px 12px rgba(0,0,0,.45), inset 0 -5px 10px rgba(0,0,0,.25); transform: translateY(-4px); transition: transform .06s, box-shadow .06s; }
  .mush.pressed { transform: translateY(3px); box-shadow: 0 1px 0 #5A1A04, 0 2px 4px rgba(0,0,0,.45), inset 0 -2px 6px rgba(0,0,0,.3); }
  .mush:disabled { filter: grayscale(.6) brightness(.8); cursor: default; }
  .mush:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .cp-plate { display: inline-flex; gap: 8px; align-items: baseline; background: #D9D6CF; color: #1C2024; font: 800 14px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; font-stretch: 88%;
    padding: 4px 10px; border-radius: 2px; box-shadow: inset 0 0 0 1px #8F8B81; }
  .cp-plate span { font-weight: 600; color: #555B61; font-size: 12px; }
  .lamps { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .lamp { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #C9CDD1; }
  .lamp i { width: 13px; height: 13px; border-radius: 50%; background: #23272B; box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 0 0 2px #2A2F35; }
  .lamp.on i { background: #4FBF85; box-shadow: 0 0 10px #4FBF85, 0 0 0 2px #2A2F35; }
  .lamp.amb.on i { background: #F2B705; box-shadow: 0 0 10px #F2B705, 0 0 0 2px #2A2F35; }
  .cp-hint { margin-top: 8px; font-size: 12px; color: #A9AFB5; }
  .success { flex: 1 1 100%; display: flex; align-items: center; gap: 14px; background: var(--good-bg); color: #fff; border-radius: 6px; padding: 16px; animation: pop .45s ease; }
  .success .tick { width: 52px; height: 52px; flex: none; border-radius: 50%; background: #fff; color: var(--good-bg); display: grid; place-items: center; }
  .success .tick svg, .donebadge svg { display: block; }
  .success b { display: block; line-height: 1.35; font-size: 20px; font-weight: 800; font-stretch: 88%; } .success span { display: block; line-height: 1.5; font-size: 14px; opacity: .92; margin-top: 2px; }
  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
  .tag.full { background: var(--good-bg); border-color: var(--good-bg); color: #fff; font-size: 16px; padding: 6px 12px; }
  @media (prefers-reduced-motion: reduce) { .success, .cpanel.shakebtn, .big.shakebtn, .tag.pick.no { animation: none; } }

  .lcd { margin-top: 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; background: #16231C; border: 2px solid #1C2024;
    border-radius: 3px; padding: 4px 10px; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
  .lcd-l { font-size: 12px; font-weight: 700; color: #6FB98F; }
  .lcd-v { font-family: "Big Shoulders Stencil Display", "Courier New", monospace; font-size: 22px; color: #8CF5B5; text-shadow: 0 0 6px rgba(140,245,181,.6); }
  .lamp.hot.on i { background: #F06A2C; box-shadow: 0 0 10px #F06A2C, 0 0 0 2px #2A2F35; }
  .tag.lg { font-size: 16px; padding: 6px 12px; }

  .lesson { margin: 0 0 8px; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.55; font-weight: 600; color: var(--ink); }
  .lesson:empty { display: none; }
  #task.minor { font-size: 14px; font-weight: 500; color: var(--muted); padding-left: 10px; border-left: 3px solid var(--hazard); }
  #card.done #task.minor { opacity: .7; }
  .thresh { display: flex; align-items: center; gap: 8px; align-self: flex-start; padding: 5px 10px 5px 8px; border-radius: 3px; border: 2px dashed var(--line);
    font-size: 13px; color: var(--muted); transition: background .3s, color .3s, border-color .3s, box-shadow .3s; }
  .thresh b { font-family: "Big Shoulders Stencil Display", "Archivo", "IBM Plex Sans Thai", sans-serif; font-size: 18px; color: var(--ink); }
  .th-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .thresh.on { background: var(--heat-bg); border: 2px solid var(--heat-bg); color: #fff; box-shadow: 0 0 0 4px rgba(194, 65, 12, .25), 0 0 18px rgba(240, 106, 44, .6); animation: thglow 1.2s ease-in-out infinite; }
  .thresh.on b { color: #fff; } .thresh.on .th-dot { background: #FFE2C2; box-shadow: 0 0 8px #FFE2C2; }
  @keyframes thglow { 50% { box-shadow: 0 0 0 7px rgba(194, 65, 12, .15), 0 0 26px rgba(240, 106, 44, .8); } }
  .meter.hot .fl { background: linear-gradient(90deg, var(--heat), #FF9A3C) !important; box-shadow: 0 0 10px rgba(240, 106, 44, .8); }
  .meter.hot .mk { background: #FF9A3C; box-shadow: 0 0 6px #FF9A3C; }
  .lcd.hot { background: #2A1408; } .lcd.hot .lcd-v { color: #FFB27A; text-shadow: 0 0 8px rgba(255, 140, 60, .8); } .lcd.hot .lcd-l { color: #E8935C; }
  @media (prefers-reduced-motion: reduce) { .thresh.on { animation: none; } }

  .lcd2 .lcd-v2 { font-family: "Big Shoulders Stencil Display", "Courier New", monospace; font-size: 22px; color: #8CF5B5; text-shadow: 0 0 6px rgba(140,245,181,.6); }
  .lcd2 { margin-top: 6px; }
  .thresh.cool.on { background: var(--good-bg); border-color: var(--good-bg); box-shadow: 0 0 0 4px rgba(47, 138, 91, .25), 0 0 18px rgba(79, 191, 133, .6); animation: none; }
  .meter.cool .fl { background: linear-gradient(90deg, #4A9AD6, var(--good)) !important; }
  .cpanel.fail { box-shadow: inset 0 0 0 3px var(--heat), 0 3px 0 #1C2024; }
  .cp-reset { min-height: 44px; margin-top: 8px; font: 800 13px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; background: #D9D6CF; color: #1C2024; border: 2px solid #1C2024; border-radius: 3px; padding: 7px 12px; cursor: pointer; }
  .cpanel.shakebtn { animation: shake .35s ease; }
  .selector { margin-top: 8px; display: flex; gap: 8px; background: #23272B; padding: 4px; border-radius: 4px; box-shadow: inset 0 2px 5px rgba(0,0,0,.6); }
  .selector button { min-height: 44px; flex: 1; display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px; border: 0; border-radius: 3px; cursor: pointer;
    background: linear-gradient(180deg, #5C636B, #444A51); color: #E9E7E2; font: 800 13px "Archivo", "IBM Plex Sans Thai", Arial, sans-serif; box-shadow: 0 2px 0 #15181B; }
  .selector button span { font-size: 12px; font-weight: 600; color: #B8BEC4; }
  .selector button.on { background: linear-gradient(180deg, #F7C93A, #E0A800); color: #1C2024; box-shadow: inset 0 2px 3px rgba(0,0,0,.35); }
  .selector button.on span { color: #3B3000; }
  .selector button:focus-visible, .cp-reset:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .recipe { border: 2px solid var(--ink); border-radius: 4px; padding: 8px 10px; background: rgba(255,255,255,.35); }
  .rec-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .rec-n { font-family: "Big Shoulders Stencil Display", "Archivo", sans-serif; font-size: 18px; }
  .rec-body { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .slots { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slot { height: 34px; border: 2px dashed var(--line); border-radius: 3px; display: grid; place-items: center; font: 800 13px "Archivo", sans-serif; color: #1C2024; }
  .slot.fill { border: 2px solid #1C2024; background: radial-gradient(circle at 30% 30%, #fff8, transparent 60%), var(--c); animation: pop .35s ease; }
  .cprev { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); min-width: 52px; }
  .cs { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); transition: background .5s ease; }
  .cs.empty { background: transparent !important; border-style: dashed; border-color: var(--line); }
  .chem { margin-top: 8px; display: grid; gap: 4px; }
  .crow { display: grid; grid-template-columns: 52px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; }
  .crow em { font-style: normal; font-size: 12px; color: var(--muted); }
  .ctr { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .ctr i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .6s cubic-bezier(.3,.9,.3,1); }
  .crow.ca i { background: #8A8F96; } .crow.si i { background: #C9A85A; } .crow.al i { background: #6E8FA6; } .crow.fe i { background: var(--good-bg); }
  .crow.fe.bad i { background: var(--heat-bg); } .crow.fe.bad em { color: var(--heat); font-weight: 800; }
  .lab { flex: 1 1 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; transition: opacity .4s; }
  .lab.off { opacity: .45; }
  .mtile { position: relative; min-height: 64px; display: grid; grid-template-columns: 40px minmax(0, 1fr); row-gap: 4px; align-items: center; gap: 8px; padding: 8px 8px; text-align: left;
    background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; color: var(--ink); cursor: pointer; font: 700 16px "Archivo", "IBM Plex Sans Thai", sans-serif; }
  .mtile .sw { width: 40px; height: 40px; border-radius: 50% 44% 52% 40%; border: 2px solid #1C2024;
    background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.75), transparent 45%), radial-gradient(circle at 70% 75%, rgba(0,0,0,.18), transparent 50%), var(--c);
    box-shadow: inset -3px -4px 0 rgba(0,0,0,.12); }
  .mtile .nm { display: flex; flex-direction: column; line-height: 1.25; font-size: 15px; }
  .mtile .nm small { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--heat); margin-top: 2px; }
  .mtile .sy { font: 800 13px "Archivo", sans-serif; white-space: nowrap; min-width: 34px; height: 30px; padding: 0 6px; border-radius: 3px; background: #23272B; color: #F2B705; display: grid; place-items: center; }
  .mtile.on { box-shadow: 0 0 0 3px var(--hazard); }
  .mtile.added { background: var(--good-bg); border-color: var(--good-bg); color: #fff; }
  .mtile.added .sy { background: #fff; color: var(--good-bg); }
  .mtile .sw { grid-row: span 2; }
  .mtile .sy { grid-column: 2; justify-self: start; height: 24px !important; }
  .mtile.warn { grid-column: 1 / -1; border-style: dashed; border-color: var(--heat); background: repeating-linear-gradient(-45deg, transparent 0 10px, rgba(194,65,12,.06) 10px 20px), var(--panel); }
  .mtile.warn .sy { background: var(--heat-bg); color: #fff; }
  .mtile:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";
if (!window.THREE) { document.getElementById("view").insertAdjacentHTML("beforeend", '<div class="nogl">The 3D plant could not load. Check your connection and reload.</div>'); return; }

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#cccccc";
const stage=document.getElementById("stage");
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches||location.hash==="#snap";

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-300,500);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a969c,.72));
const sun=new THREE.DirectionalLight(0xffffff,.85);
sun.position.set(30,60,26);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:55,bottom:-55,near:1,far:200});
sun.shadow.bias=-.0008;scene.add(sun);

const v=(x,y,z)=>new THREE.Vector3(x,y,z);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:.05,flatShading:true},o||{}));
const mat={
 steel:M(0x9aa9b2),frame:M(0x5b6b75),dark:M(0x34414a),belt:M(0x46545d),
 rock:M(0xf2f4f3),rock2:M(0xe3e8e8),rock3:M(0xd3dadb),
 pyro:M(0xadbfca),sand:M(0xe6dcc3),feld:M(0xead6cc),white:M(0xfbfcfc),
 pad:M(0xbfc9ce),yellow:M(0xd8a33c),water:M(0x3f86bd),fuel:M(0x6b5a4a),gyp:M(0xf5f1e6),
 cool:M(0x7d8d96,{side:THREE.DoubleSide}),
 zCalc:M(0x9c8c80,{side:THREE.DoubleSide}),
 zTrans:M(0x8a5a44,{side:THREE.DoubleSide,emissive:0x2a0d04}),
 zSint:M(0xa3401f,{side:THREE.DoubleSide,emissive:0x9a2e08}),
 zDis:M(0x70402c,{side:THREE.DoubleSide,emissive:0x3a1206}),

const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d);

let U=null;const pickables=[];

  const A=v(...a),B=v(...b),len=A.distanceTo(B);
  const g=new THREE.Group();g.position.copy(A).lerp(B,.5);
  add(box(.9,.35,len),mat.belt,0,0,0,g);add(box(1.1,.12,len),mat.steel,0,.4,0,g);
  scene.add(g);g.lookAt(B);
  const n=Math.max(1,Math.floor(len/4));
  for(let i=1;i<=n;i++){const p=A.clone().lerp(B,i/(n+1));if(p.y>.6)add(box(.22,p.y,.22),mat.frame,p.x,p.y/2,p.z);}
}
function pad(x,z,w,d){add(box(w,.12,d),mat.pad,x,.06,z);}
function spinTube(a,b,r,m,parts){ // rotating cylinder between points; returns spin group
  const A=v(...a),B=v(...b),L=A.distanceTo(B);
  const piv=new THREE.Group();piv.position.copy(A).lerp(B,.5);
  piv.rotation.z=Math.atan2(B.y-A.y,B.x-A.x);scene.add(piv);
  const spin=new THREE.Group();piv.add(spin);
  (parts||[[-L/2,L/2,m]]).forEach(([x0,x1,mm])=>{
    const c=add(new THREE.CylinderGeometry(r,r,x1-x0,18,1,true),mm,(x0+x1)/2,0,0,spin);c.rotation.z=Math.PI/2;

}
function smallFilter(x,z,h){

  const hp=add(cyl(1.25,.25,1,4),mat.frame,x,h-.5,z);hp.rotation.y=Math.PI/4;
  [[-.7,-.7],[.7,.7],[-.7,.7],[.7,-.7]].forEach(([a,b])=>add(box(.14,h-.4,.14),mat.frame,x+a,(h-.4)/2,z+b));
  add(cyl(.2,.2,2.4,8),mat.dark,x+.5,h+3.2,z+.5);
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:css("--ground"),roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.set(0,0,-4);ground.receiveShadow=true;scene.add(ground);

/* ---------- raw materials ---------- */
U="quarry";
pad(-30,10,16,14);
const PILES=[{n:"Limestone",c:0xdcdad3,x:-37.5,good:1},
 {n:"Al–Si source",c:0xadbfca,x:-34.5,good:1},
 {n:"Iron (Fe)",c:0x8e3b22,x:-31.5,good:0},
 {n:"Silica corrector",c:0xe7dcc0,x:-28.5,good:1},
 {n:"Flux",c:0xead6cc,x:-25.5,good:1}];
PILES.forEach(P=>{P.m=M(P.c);add(new THREE.ConeGeometry(1.25,1.7,8),P.m,P.x,.85,16.2);});
function truck(x,z,ry,tank){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
  add(box(3.4,.45,1.6),mat.dark,0,.75,0,g);
  if(tank){const t=add(cyl(.8,.8,2.3,14),mat.white,-.45,1.75,0,g);t.rotation.z=Math.PI/2;}
  else{add(box(2,1.1,1.7),mat.yellow,-.5,1.5,0,g);add(box(1.6,.5,1.4),mat.rock,-.5,2.2,0,g);}
  add(box(.9,1.1,1.5),tank?mat.steel:mat.yellow,1.15,1.5,0,g);
  [[-1,.8],[-1,-.8],[1,.8],[1,-.8]].forEach(([a,b])=>{const w=add(cyl(.42,.42,.35,10),mat.dark,a,.42,b,g);w.rotation.x=Math.PI/2;});
}
truck(-29,9.6,.35,false);

/* ---------- crusher ---------- */
U="crusher";
pad(-18.5,10,8,7);
add(box(4,3,4),mat.frame,-20,1.5,10);
const hop=add(cyl(2.1,.7,1.9,4),mat.steel,-20,3.95,10);hop.rotation.y=Math.PI/4;
const scr=add(box(2.6,.3,1.6),mat.steel,-17,1.9,10);scr.rotation.z=-.2;
[[-17.9,1.6],[-16.1,1.1]].forEach(([x,h])=>{add(box(.2,h,.2),mat.frame,x,h/2,9.4);add(box(.2,h,.2),mat.frame,x,h/2,10.6);});
add(box(1.4,.8,1.2),mat.dark,-17,.4,11.6);
U="rawmill";conveyor([-15.8,1.4,10],[-11.6,5.2,6.2]);

/* ---------- raw mill + silo ---------- */
pad(-10,4,9,12);
add(box(4,2,4),mat.frame,-10,1,6);
add(cyl(1.8,2,2.6,10),mat.steel,-10,3.3,6);
add(cyl(.7,1.8,1.4,10),mat.steel,-10,5.3,6);
add(cyl(.7,.7,1,10),mat.dark,-10,6.5,6);
pipe([[-10,7,6],[-10,8.6,6],[-10,8.6,1],[-10,7.9,1]],.28);
add(cyl(1.7,1.7,7,16),mat.white,-10,3.5,1);
add(cyl(.3,1.75,.8,16),mat.steel,-10,7.4,1);
smallFilter(-13.2,7.8,3);
U="preheater";pipe([[-8.4,1,1],[-3,1,-7.5],[-3,17.4,-7.5]],.26);
pipe([[-3,17.4,-7.5],[-3,17.4,-3],[-1.9,16.8,-3]],.22);

/* ---------- two kiln lines ---------- */
const spins=[];const flames=[];
function cyclone(x,y,z){add(cyl(.9,.9,1.3,12),mat.steel,x,y,z);add(cyl(.9,.22,1.6,12),mat.steel,x,y-1.45,z);}
function kilnLine(zl){
  U="preheater";
  pad(0,zl,7,6);pad(10.5,zl,16,4.8);pad(22.5,zl,11,4.8);
  [[-2.2,-2.2],[2.2,-2.2],[-2.2,2.2],[2.2,2.2]].forEach(([x,z])=>add(box(.3,17,.3),mat.frame,x,8.5,zl+z));
  [4,7.5,11,14.5].forEach(y=>add(box(5,.18,5),mat.steel,0,y,zl));
  add(box(5.2,.5,5.2),mat.dark,0,17.2,zl);
  cyclone(-1.1,15.9,zl);cyclone(1.1,15.9,zl);cyclone(.8,12.6,zl);cyclone(-.8,9.1,zl);cyclone(.8,5.6,zl);

  add(box(2,3.2,3),mat.frame,3,3.4,zl);
  U="kiln";
  // kiln with zones (inlet -> outlet)
  const K=spinTube([3.9,3.4,zl],[17.6,2.8,zl],1.3,null,[]);
  const L=K.L,x0=-L/2;
  const zones=[[0,5.5,mat.zCalc],[5.5,9,mat.zTrans],[9,12.2,mat.zSint],[12.2,L,mat.zDis]];
  zones.forEach(([a,b,m])=>{const c=add(new THREE.CylinderGeometry(1.3,1.3,b-a,18,1,true),m,x0+(a+b)/2,0,0,K.spin);c.rotation.z=Math.PI/2;});
  [-4.4,0,4.4].forEach(x=>{const t=add(new THREE.TorusGeometry(1.46,.16,6,24),mat.dark,x,0,0,K.spin);t.rotation.y=Math.PI/2;
    const p=K.A.clone().lerp(K.B,.5+x/L);add(box(1.6,p.y-1.2,2.2),mat.frame,p.x,(p.y-1.2)/2,zl);});
  spins.push([K.spin,.5]);
  U="cooler";
  // hood (transparent) + burner flame
  add(box(2,4.6,3.6),mat.hood,18.2,2.3,zl).castShadow=false;
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(box(2,4.6,3.6)),new THREE.LineBasicMaterial({color:0x5b6b75}));
  edges.position.set(18.2,2.3,zl);scene.add(edges);
  const f1=new THREE.Mesh(new THREE.ConeGeometry(.75,3,10),new THREE.MeshBasicMaterial({color:0xff7a2a}));
  f1.rotation.z=Math.PI/2;f1.position.set(16.2,2.9,zl);scene.add(f1);
  const f2=new THREE.Mesh(new THREE.ConeGeometry(.4,2,10),new THREE.MeshBasicMaterial({color:0xffd27a}));
  f2.rotation.z=Math.PI/2;f2.position.set(16.7,2.9,zl);scene.add(f2);
  const gl=new THREE.PointLight(0xff6a1f,1.3,12,2);gl.position.set(16.5,3,zl);scene.add(gl);

  const C=spinTube([18.6,1.5,zl],[26.5,1.05,zl],.95,mat.cool);

  pipe([[18.45,3.7,zl-1.4],[18.45,3.7,zl+1.4]],.1,mat.water);
  pipe([[18.45,3.7,zl+1.4],[18.45,5.6,zl+2.4],[21,5.6,zl+2.4],[21,0,zl+2.4]],.1,mat.water);

/* ---------- kiln cutaway (shown in the kiln step) ---------- */
U="kiln";
const cut=new THREE.Group();KA.spin.parent.add(cut);cut.visible=false;

  const L=KA.L,x0=-L/2,TS=1.54,TL=Math.PI*2-2.2;

  const brick=M(0xb05a40,{side:THREE.DoubleSide});

  b.addEventListener("pointerdown", e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} set(true); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => b.addEventListener(ev, () => set(false)));
  b.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); set(true); } });

 { view: "preheater", method: ["Collect data & correlate", "เก็บข้อมูล หาความสัมพันธ์"], takeaway: "กราฟของคุณคือหลักฐาน: อุณหภูมิผ่าน 900 °C เมื่อไหร่ น้ำหนักลดลงทันที อุณหภูมิกับการปล่อย CO₂ สัมพันธ์กัน", phase: "เคมีของ Calcination", title: "Preheater tower + Precalciner",
   task: "กด เผา ค้างไว้ แล้วดูกราฟ",
   setup() {
     S.T = 20; S.acc = 0; S.n = 0; S.heat = false;
     S.upT = meter("อุณหภูมิ", 1000, 900);
     S.th = document.createElement("div"); S.th.className = "thresh"; S.th.innerHTML = `<span class="th-dot"></span><b>~900 °C</b><span class="th-t">Calcination เร่งตัว</span>`;
     $("hud").appendChild(S.th); S.meterEl = $("hud").querySelector(".meter");
     tag("Preheater / Precalciner", [0, 19.8, -4]); S.rx = tag("CaCO₃ → CaO + CO₂", [-.4, 13.2, -3], "co2 lg off");
     S.chart = dataChart(); S.chart.add(20, 100); S.log = 0;
     const eq = document.createElement("div"); eq.className = "eqbox";
     eq.innerHTML = `<div class="eq-m"><span>CaCO₃</span><i>→</i><span>CaO</span><i>+</i><span class="co2">CO₂</span></div>`;
     $("actions").appendChild(eq);
     S.cp = controlPanel({ label: "เผา", aria: "กดค้างเพื่อให้ความร้อน", plate: "Precalciner", lcd: "อุณหภูมิหอ",
       lamps: [["ไฟเข้า", "on"], ["ให้ความร้อน", "amb"], ["ถึง 900 °C", "hot"]], hint: "กดปุ่มสีแดงค้างไว้ แล้วดูกราฟ", onHold: x => S.heat = x });
     fb("");
   },
   update(dt) {
     if (!S.cp) return;
     S.T = clamp(S.T + (S.heat || S.n >= 10 ? 320 : -150) * dt, 20, 950);
     if (S.n < 10 && S.T > 925) S.T = 925; // calcination soaks up the heat: temperature plateaus while CO₂ leaves
     S.upT(S.T, Math.round(S.T) + " °C");
     S.pre = Math.max(S.pre || 0, .15 * Math.pow(clamp((S.T - 650) / 250, 0, 1), 2)); // slow decomposition starts ~650 °C
     S.mass = 100 - 35 * (S.pre + (1 - .15) * clamp((S.n + (S.T >= 900 && S.n < 10 ? S.acc / .35 : 0)) / 10, 0, 1));
     S.log += dt; if (S.log > .08) { S.log = 0; S.chart.add(S.T, S.mass); }
     const past = S.T >= 900;
     if (S.cp.cp.isConnected) { S.cp.lcd(Math.round(S.T) + " °C"); S.cp.lamp(1).classList.toggle("on", S.heat); S.cp.lamp(2).classList.toggle("on", past); S.cp.cp.querySelector(".lcd").classList.toggle("hot", past); }
     if (past !== S.wasPast) { S.wasPast = past; S.th.classList.toggle("on", past); S.meterEl.classList.toggle("hot", past); S.rx.el.classList.toggle("off", !past);
       S.th.querySelector(".th-t").textContent = past ? "กำลังเกิด Calcination" : "Calcination เร่งตัว"; if (past) buzz(30); }
     FX.tower = clamp((S.T - 250) / 750, 0, 1);
     if (S.T >= 900) { FX.gasMode = "rock"; FX.gasAmt = 1;
       if (S.n < 10) { S.acc += dt; if (S.acc > .35) { S.acc = 0; S.n++; G.rock = S.n; buzz(8);

         if (S.n === 10) { save(); S.cp.release(); S.heat = false;
           successPanel(S.cp.cp, "หินปล่อย CO₂ ออกมาเอง", "สมการ Calcination: CaCO₃ → CaO + CO₂");
           S.chart.note("น้ำหนักที่หายไป ส่วนใหญ่คือ CO₂");
           fb("");
           goal.t.set(1.6, 9.5, -4.5); goal.s = 28; complete("รอวิทยากรก่อน"); } } } }
     else { FX.gasMode = S.n ? "rock" : "normal"; FX.gasAmt = S.n ? .5 : 1; }
   } },

 { view: "kiln", method: ["Find the condition", "หาเงื่อนไขที่ทำให้เกิดผล"], takeaway: "คุณทดลองจนเจอเงื่อนไข: ต้องถึง 1,500 °C และค้างไว้นานพอ ถ้าขาดอย่างใดอย่างหนึ่ง Clinker ไม่เกิด", phase: "การผลิต Clinker", title: "Rotary kiln", task: "กด Burner ค้างไว้จนถึง 1,500 °C",
   setup() {
     FX.cutaway = true; S.T = 900; S.burn = false; S.hot = 0; S.formed = false;
     S.upT = meter("อุณหภูมิ", 1650, 1500);
     S.th = threshBadge("1,500 °C", "จุดเกิด Clinker", "Clinker formation");
     tag("Burner", [17.6, 5.2, -3]); S.clk = tag("Clinker เกิดตรงนี้", [13, 4.6, -3], "off");
     S.cp = controlPanel({ label: "จุดไฟ", aria: "กด Burner ค้างไว้", plate: "Kiln burner", lcd: "อุณหภูมิ Kiln",
       lamps: [["ไฟเข้า", "on"], ["Burner on", "amb"], ["ถึง 1,500 °C", "hot"]], hint: "กดปุ่มสีแดงค้างไว้", onHold: x => S.burn = x });
     fb("เปลวไฟเผาเชื้อเพลิง และการเผาเชื้อเพลิงก็ปล่อย CO₂ ด้วย");
   },
   update(dt) {
     const firing = S.burn || S.formed;
     S.T = clamp(S.T + (firing ? 250 : -170) * dt, 900, 1650); S.upT(S.T, Math.round(S.T).toLocaleString() + " °C");
     FX.flame += ((firing ? 1 : 0) - FX.flame) * Math.min(1, dt * 6); FX.sint = .3 + 1.4 * (S.T - 900) / 700;
     FX.gasMode = firing ? "fuel" : "normal";
     const past = S.T >= 1500; S.th(past);
     if (S.cp.cp.isConnected) { S.cp.lcd(Math.round(S.T).toLocaleString() + " °C"); S.cp.lamp(1).classList.toggle("on", S.burn); S.cp.lamp(2).classList.toggle("on", past); S.cp.cp.querySelector(".lcd").classList.toggle("hot", past); }
     if (!S.formed) { if (past) S.hot += dt; else S.hot = Math.max(0, S.hot - dt);
       if (S.hot > 1.6) { S.formed = true; save(); S.cp.release(); S.burn = false; S.clk.el.classList.remove("off"); S.clk.el.classList.add("lg");
         successPanel(S.cp.cp, "ได้ Clinker แล้ว", "Clinker (ลูกปูน) เกิดจากการนำผงวัตถุดิบ (Raw Meal) ไปเผาที่อุณหภูมิสูง จนเกิดการเปลี่ยนแปลงทางเคมีและจับตัวกันเป็นก้อนแข็งขนาดเล็ก");
         fb(""); complete("รอวิทยากรก่อน"); } }
   } },

 { view: "cooler", phase: "ล็อกความขาวไว้", title: "Clinker cooler", task: "ตั้งสมมติฐาน แล้วทดลองเทียบ 2 แบบ: เย็นช้า กับ เย็นเร็ว",

/* ================= camera ================= */
const cur = { t: v(...VIEWS.overview.t), s: VIEWS.overview.s, th: VIEWS.overview.th, el: VIEWS.overview.el };

function applyCam() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1, a = w / h;
  const H = a < 1.2 ? cur.s * 1.25 / a : cur.s, W = H * a;
  const fx = w > 820 ? .62 : .5, fy = .5;

  const d = 140, c = Math.cos(cur.el);
  cam.position.set(cur.t.x + Math.sin(cur.th) * c * d, cur.t.y + Math.sin(cur.el) * d, cur.t.z + Math.cos(cur.th) * c * d);
  cam.lookAt(cur.t);
}

  fuels.forEach((q, i) => {

    dummy.position.copy(pt); dummy.rotation.set(q.u * 30, 0, 0); dummy.scale.setScalar(q.u > .88 ? (1 - q.u) / .12 : 1); dummy.updateMatrix();
    fuelMesh.setMatrixAt(i, dummy.matrix); tmp.copy(q.c).lerp(C.hot, q.u > .85 ? (q.u - .85) / .15 : 0); fuelMesh.setColorAt(i, tmp);
  });
  fuelMesh.instanceMatrix.needsUpdate = true; fuelMesh.instanceColor.needsUpdate = true;
  gases.forEach((q, i) => {
    q.u = (q.u + dt * .03 * sp * (FX.gasMode === "normal" ? 1 : 2)) % 1; const pt = q.g.getPointAt(q.u).add(q.j);
    const big = FX.gasMode === "normal" ? 1 : 1.45;
    dummy.position.copy(pt); dummy.scale.setScalar((.7 + q.u * .9) * big * FX.gasAmt); dummy.updateMatrix(); gasMesh.setMatrixAt(i, dummy.matrix);
    const base = FX.gasMode === "rock" ? gasRock : FX.gasMode === "fuel" ? gasFuel : C.gas;
    tmp.copy(base).lerp(C.gasHot, FX.gasMode === "normal" ? clamp(1 - q.u / .35, 0, 1) : 0); gasMesh.setColorAt(i, tmp);
  });
  gasMesh.instanceMatrix.needsUpdate = true; gasMesh.instanceColor.needsUpdate = true;
  const spr = G.step === 5 ? .4 + FX.spray * 2.2 : 1;
  drops.forEach((q, i) => { const u = (q.o + time * 1.2 * sp * spr) % 1;
    dummy.position.set(q.x + u * .4, 3.6 - u * 1.9, q.zl + q.z * (1 - u * .3)); dummy.scale.setScalar(G.step === 5 ? .6 + FX.spray * 1.4 : 1); dummy.updateMatrix(); dropMesh.setMatrixAt(i, dummy.matrix); });
  fans.forEach(h => h.rotation.z -= dt * sp * (G.step === 5 ? 4 + FX.spray * 30 : 3));
  dropMesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < SN; i++) { const s = sSeed[i], u = (s.o + time * .16 * sp) % 1; sPos[i * 3] = s.x + Math.sin(u * 6 + i) * .3; sPos[i * 3 + 1] = 4.7 + u * 5.5; sPos[i * 3 + 2] = s.z; }
  steamGeo.attributes.position.needsUpdate = true; steamMat.opacity = G.step === 5 ? .45 + FX.spray * .5 : .5;

  PILES.forEach(P => { const on = P.good && (G.step !== 1 || P.picked); P.flow += ((on ? 1 : 0) - P.flow) * Math.min(1, dt * 3); });
  pileFlow.forEach((q, i) => { const P = q.P; q.u = (q.u + dt * sp * 2.2 / P.len * (1 + FX.matBoost)) % 1;
    const pt = P.path.getPointAt(q.u).add(q.j); dummy.position.copy(pt); dummy.rotation.set(q.u * 30, q.u * 20, 0);
    dummy.scale.setScalar(P.flow < .02 ? 0 : P.flow * (q.u > .95 ? (1 - q.u) / .05 : 1)); dummy.updateMatrix(); pileMesh.setMatrixAt(i, dummy.matrix); });
  pileMesh.instanceMatrix.needsUpdate = true;
  { const target = G.step === 2 ? mealLevel : (G.step > 2 || G.done[2] ? 1 : 0); mealShown += (target - mealShown) * Math.min(1, dt * 4);
    const lv = Math.max(.001, mealShown); gaugeFill.scale.y = lv; gaugeFill.position.y = .1 + 6.2 * lv / 2;
    const full = mealShown > .98; gaugeMat.color.setHex(full ? 0x2f8a5b : 0xF2B705); gaugeMat.emissive.setHex(full ? 0x2f8a5b : 0xF2B705);
    fullRingMat.emissiveIntensity = full && G.step === 2 ? .8 + Math.sin(time * 5) * .4 : (full ? .3 : 0); }
  jawKick = Math.max(0, jawKick - dt * 3.5);
  jawPivot.rotation.z = -.28 - .22 * jawKick - (G.step === 2 ? Math.sin(time * 5) * .02 : 0);
  flywheels.forEach(g => g.rotation.z -= dt * sp * (G.step === 2 ? 1.5 + jawKick * 14 : .8));
  burst.forEach((b, i) => { if (b.life > 0) { b.life -= dt; b.vel.y -= 14 * dt; b.p.addScaledVector(b.vel, dt); if (b.p.y < .3) { b.p.y = .3; b.vel.set(0, 0, 0); } }
    dummy.position.copy(b.life > 0 ? b.p : v(0, -50, 0)); dummy.scale.setScalar(b.life > 0 ? Math.min(1, b.life * 2) : 0); dummy.rotation.set(i, i * .7, 0); dummy.updateMatrix(); burstMesh.setMatrixAt(i, dummy.matrix); });
  burstMesh.instanceMatrix.needsUpdate = true;
  shakeT = Math.max(0, shakeT - dt);
  nod.forEach((n, i) => { const j = shakeT > 0 ? Math.sin(time * 40 + i) * .05 * shakeT : 0;
    dummy.position.set(BIN.x + n.x + j, n.y + Math.abs(j) * 2, BIN.z + n.z + j * .6); dummy.rotation.set(n.r, n.r * 1.3 + j * 3, 0); dummy.scale.setScalar(n.s); dummy.updateMatrix(); nodMesh.setMatrixAt(i, dummy.matrix); });
  nodMesh.instanceMatrix.needsUpdate = true;
  ring.visible = false; boundary.visible = !!FX.boundary;

  const w = stage.clientWidth, h = stage.clientHeight;
  TAGS.forEach(t => { proj.copy(t.pos).project(cam); const x = (proj.x + 1) / 2 * w, y = (1 - proj.y) / 2 * h;
    t.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) translate(-50%," + (t.below ? "0" : "-100%") + ")"; });
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
nodMesh.instanceColor.needsUpdate = true; pileMesh.instanceColor.needsUpdate = true;
applyTheme(); resize(); go(G.step); frame();
})();
